# Quick-test overlay for Zigbee FOTA verification.
# Use together with FILE_SUFFIX=fota.

# Ensure update image is newer than a 1.2.4 device image.
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.2.5"

# Reduce waiting time during OTA server discovery and image query.
CONFIG_ZIGBEE_FOTA_SERVER_DISOVERY_INTERVAL_HRS=1
CONFIG_ZIGBEE_FOTA_IMAGE_QUERY_INTERVAL_MIN=1

# Keep explicit progress callback enabled for easier observation.
CONFIG_ZIGBEE_FOTA_PROGRESS_EVT=y
