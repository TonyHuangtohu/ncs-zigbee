# Zigbee FOTA overlay for version 1.2.6 upgrade
# Use this configuration to build the upgrade image from 1.2.5 to 1.2.6

# Set the firmware version to 1.2.6
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="1.2.7"

# Reduce waiting time during OTA server discovery and image query for easier testing
CONFIG_ZIGBEE_FOTA_SERVER_DISOVERY_INTERVAL_HRS=1
CONFIG_ZIGBEE_FOTA_IMAGE_QUERY_INTERVAL_MIN=1

# Keep explicit progress callback enabled for easier observation
CONFIG_ZIGBEE_FOTA_PROGRESS_EVT=y
